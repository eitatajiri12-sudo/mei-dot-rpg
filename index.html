<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>MEI DOT RPG</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;height:100%;background:#101010;color:#fff;
  font-family:monospace;overflow:hidden;touch-action:none
}
body{display:flex;align-items:center;justify-content:center}
#game{
  width:100%;max-width:560px;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:10px
}
h2{margin:0;font-size:28px;letter-spacing:2px}
#field{
  position:relative;
  width:min(84vw,420px);
  aspect-ratio:1/1;
  background:
    radial-gradient(circle at 25% 35%,rgba(255,255,255,.05) 0 1px,transparent 1px),
    radial-gradient(circle at 70% 68%,rgba(0,0,0,.05) 0 1px,transparent 1px),
    #63b34c;
  background-size:12px 12px,16px 16px,auto;
  border:4px solid #f2efe7;
  overflow:hidden;
  image-rendering:pixelated;
}
#player{
  position:absolute;
  width:64px;
  height:80px;
  image-rendering:pixelated;
  will-change:left,top;
}
#heroCanvas{
  width:64px;
  height:80px;
  display:block;
  image-rendering:pixelated;
}
#controls{
  display:grid;
  grid-template-columns:78px 78px 78px;
  grid-template-rows:64px 64px;
  gap:10px;
  user-select:none;
}
button{
  font:inherit;font-size:27px;
  background:#222;color:#fff;
  border:2px solid #eee;border-radius:10px;
  touch-action:none;user-select:none;
}
button:active{background:#444}
#up{grid-column:2;grid-row:1}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#note{font-size:13px;color:#bbb;text-align:center}
</style>
</head>
<body>
<div id="game">
  <h2>MEI DOT RPG</h2>
  <div id="field">
    <div id="player"><canvas id="heroCanvas" width="32" height="40"></canvas></div>
  </div>

  <div id="controls">
    <button id="up">▲</button>
    <button id="left">◀</button>
    <button id="down">▼</button>
    <button id="right">▶</button>
  </div>

  <div id="note">長押し対応 / 矢印キー / WASD</div>
</div>

<script>
const canvas = document.getElementById('heroCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const C = {
  k:'#171717', h:'#764323', h2:'#9c5c31', h3:'#c47a3c',
  s:'#f3c998', s2:'#d99b69',
  b:'#3477d2', b2:'#1f4f99', b3:'#6ca0e9',
  w:'#f4f2ec', g:'#afb8c3', g2:'#6f7986',
  y:'#f0c82e', y2:'#c79512',
  r:'#d5403f', r2:'#9c2727',
  d:'#57351f', d2:'#362116'
};

function p(x,y,w,h,c){ctx.fillStyle=C[c]||c;ctx.fillRect(x,y,w,h)}
function clear(){ctx.clearRect(0,0,32,40)}

function drawFront(f=0){
  clear();

  // hair silhouette
  p(10,2,12,1,'h3'); p(8,3,16,2,'h2');
  p(6,5,20,3,'h'); p(5,8,22,3,'h');
  p(7,7,3,2,'h3'); p(22,7,3,2,'h3');

  // face
  p(8,10,16,9,'s'); p(7,12,2,5,'s2'); p(23,12,2,5,'s2');
  p(11,13,2,2,'k'); p(19,13,2,2,'k');
  p(14,17,4,1,'s2');

  // circlet
  p(9,9,14,1,'y2'); p(14,8,4,2,'b');
  p(15,8,2,1,'w');

  // neck
  p(13,19,6,2,'s2');

  // shoulder armor
  p(7,20,18,2,'g2');
  p(5,21,5,4,'w'); p(22,21,5,4,'w');
  p(6,22,4,3,'g'); p(22,22,4,3,'g');

  // tunic / belt
  p(9,21,14,10,'b');
  p(11,23,10,8,'b2');
  p(9,27,14,2,'y2');
  p(14,27,4,2,'y');

  // cape
  p(4,22,3,10,'r');
  p(25,22,3,10,'r');
  p(3,26,2,7,'r2');
  p(27,26,2,7,'r2');

  // arms / gloves
  p(6,25,3,6,'s2'); p(23,25,3,6,'s2');
  p(6,30,3,2,'d'); p(23,30,3,2,'d');

  // sword
  p(27,20,1,7,'y2');
  p(28,18,1,7,'g2');
  p(29,15,1,6,'w');

  // legs
  p(10,31,5,5,'b2'); p(17,31,5,5,'b2');
  if(f===1){
    p(9,36,6,3,'d'); p(18,36,5,3,'d');
    p(8,38,7,1,'d2'); p(19,38,5,1,'d2');
  }else if(f===2){
    p(11,36,5,3,'d'); p(16,36,6,3,'d');
    p(11,38,5,1,'d2'); p(16,38,7,1,'d2');
  }else{
    p(10,36,5,3,'d'); p(17,36,5,3,'d');
    p(9,38,6,1,'d2'); p(17,38,6,1,'d2');
  }
}

function drawBack(f=0){
  clear();

  p(10,2,12,1,'h3'); p(8,3,16,2,'h2');
  p(6,5,20,4,'h'); p(5,9,22,5,'h');
  p(8,13,16,3,'h2');

  p(7,18,18,2,'g2');
  p(5,19,5,4,'w'); p(22,19,5,4,'w');

  // cape with folds
  p(6,21,20,13,'r2');
  p(8,20,16,14,'r');
  p(10,22,3,11,'r2');
  p(19,22,3,11,'r2');

  p(5,24,3,7,'s2'); p(24,24,3,7,'s2');

  p(10,33,5,3,'b2'); p(17,33,5,3,'b2');

  if(f===1){
    p(9,36,6,3,'d'); p(18,36,5,3,'d');
    p(8,38,7,1,'d2'); p(19,38,5,1,'d2');
  }else if(f===2){
    p(11,36,5,3,'d'); p(16,36,6,3,'d');
    p(11,38,5,1,'d2'); p(16,38,7,1,'d2');
  }else{
    p(10,36,5,3,'d'); p(17,36,5,3,'d');
    p(9,38,6,1,'d2'); p(17,38,6,1,'d2');
  }
}

function drawSide(f=0, flip=false){
  clear();
  ctx.save();
  if(flip){ctx.translate(32,0);ctx.scale(-1,1)}

  // head
  p(11,3,10,2,'h3');
  p(8,5,15,3,'h2');
  p(7,8,16,4,'h');
  p(10,10,12,8,'s');
  p(19,12,2,2,'k');
  p(10,9,12,1,'y2');
  p(14,8,4,2,'b');

  // torso
  p(8,20,15,2,'g2');
  p(9,22,14,10,'b');
  p(11,23,12,9,'b2');
  p(9,28,14,2,'y2');

  // cape
  p(6,21,4,11,'r');
  p(3,24,5,10,'r2');

  // arm
  p(21,23,4,7,'s2');
  p(22,29,3,2,'d');

  // sword
  p(24,21,1,6,'y2');
  p(25,18,1,8,'g2');
  p(26,15,1,6,'w');

  // feet
  if(f===1){
    p(8,32,6,4,'b2'); p(18,32,5,4,'b2');
    p(5,36,8,3,'d'); p(19,36,6,3,'d');
  }else if(f===2){
    p(10,32,5,4,'b2'); p(17,32,6,4,'b2');
    p(10,36,6,3,'d'); p(18,36,8,3,'d');
  }else{
    p(9,32,5,4,'b2'); p(17,32,5,4,'b2');
    p(8,36,7,3,'d'); p(17,36,7,3,'d');
  }

  ctx.restore();
}

let dir='down';
let frame=0;

function drawHero(){
  if(dir==='down') drawFront(frame);
  else if(dir==='up') drawBack(frame);
  else if(dir==='left') drawSide(frame,false);
  else drawSide(frame,true);
}
drawHero();

const field = document.getElementById('field');
const player = document.getElementById('player');

let x = 0, y = 0;
function centerPlayer(){
  x = field.clientWidth/2 - 32;
  y = field.clientHeight/2 - 40;
  player.style.left = x+'px';
  player.style.top = y+'px';
}
centerPlayer();

const speed = 3.2;     // px per update
const animEvery = 90;  // ms
let heldDir = null;
let lastMove = 0;
let lastAnim = 0;

function setDirection(d){
  dir = d;
}

function stepMove(now){
  if(heldDir){
    let dx=0,dy=0;
    if(heldDir==='up'){dy=-speed}
    if(heldDir==='down'){dy=speed}
    if(heldDir==='left'){dx=-speed}
    if(heldDir==='right'){dx=speed}

    x += dx;
    y += dy;

    x = Math.max(0, Math.min(field.clientWidth-64, x));
    y = Math.max(0, Math.min(field.clientHeight-80, y));

    player.style.left = x+'px';
    player.style.top = y+'px';

    if(now-lastAnim > animEvery){
      frame = (frame+1)%3;
      drawHero();
      lastAnim = now;
    }
  }else{
    if(frame!==0){frame=0;drawHero()}
  }
  requestAnimationFrame(stepMove);
}
requestAnimationFrame(stepMove);

function startHold(d,e){
  if(e){
    e.preventDefault();
    if(e.currentTarget && e.pointerId !== undefined){
      try{e.currentTarget.setPointerCapture(e.pointerId)}catch{}
    }
  }
  heldDir=d;
  setDirection(d);
  frame=1;
  drawHero();
}
function stopHold(){
  heldDir=null;
}

['up','down','left','right'].forEach(id=>{
  const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>startHold(id,e));
  b.addEventListener('pointerup',stopHold);
  b.addEventListener('pointercancel',stopHold);
  b.addEventListener('lostpointercapture',stopHold);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});

const keyMap={
  ArrowUp:'up',w:'up',W:'up',
  ArrowDown:'down',s:'down',S:'down',
  ArrowLeft:'left',a:'left',A:'left',
  ArrowRight:'right',d:'right',D:'right'
};
document.addEventListener('keydown',e=>{
  const d=keyMap[e.key];
  if(!d)return;
  e.preventDefault();
  if(!heldDir) startHold(d);
});
document.addEventListener('keyup',e=>{
  const d=keyMap[e.key];
  if(!d)return;
  e.preventDefault();
  if(heldDir===d) stopHold();
});

window.addEventListener('blur',stopHold);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopHold()});
window.addEventListener('resize',()=>{
  x=Math.max(0,Math.min(field.clientWidth-64,x));
  y=Math.max(0,Math.min(field.clientHeight-80,y));
  player.style.left=x+'px';
  player.style.top=y+'px';
});
</script>
</body>
</html>
