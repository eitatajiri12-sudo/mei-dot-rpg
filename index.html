.marker {
  position:absolute;
  width:14px;height:14px;border-radius:50%;
  background:#ff3a3a;border:3px solid #fff;
  transform:translate(-50%,-50%);
  z-index:25;
  display:none;
}
#dialog {
  position:absolute; left:18px; bottom:18px;
  width:min(620px,72%);
  min-height:110px;
  background:rgba(5,5,5,.96);
  border:3px solid #fff;
  border-radius:8px;
  padding:16px 20px;
  z-index:40;
  display:none;
  font-size:18px;
  line-height:1.65;
  white-space:pre-line;
}
#dialog.show { display:block; }
#dialogName {
  display:inline-block;
  margin:-34px 0 10px -8px;
  padding:3px 12px;
  background:#0a0a0a;
  border:2px solid #fff;
  border-radius:8px;
}
#side {
  display:flex; flex-direction:column; gap:10px;
  overflow:hidden;
}
.panel {
  background:var(--panel);
  border:2px solid var(--line);
  border-radius:10px;
  padding:12px;
}
#titlePanel h1 {
  font-size:24px;margin:0 0 4px 0;letter-spacing:.08em;
}
.muted { color:#bbb; font-size:12px; }
#statusGrid {
  display:grid;grid-template-columns:auto 1fr;
  gap:4px 10px;font-size:14px;
}
.bar {
  height:8px;background:#333;border:1px solid #888;margin-top:5px;position:relative;
}
.bar > i { display:block;height:100%; }
.hp i { background:#4fd05c; width:100%; }
.mp i { background:#41b9df; width:100%; }
#questText { font-size:13px;line-height:1.5;white-space:pre-line; }
#controls {
  display:grid;
  grid-template-columns:58px 58px 58px;
  grid-template-rows:50px 50px 46px;
  gap:6px;
  justify-content:center;
}
button {
  color:#fff;background:#1e1e1e;border:2px solid #eee;border-radius:9px;
  font:inherit;font-size:21px;touch-action:none;user-select:none;cursor:pointer;
}
button:active { background:#444; }
#up{grid-column:2;grid-row:1}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#action{grid-column:1/4;grid-row:3;font-size:15px}
#menu {
  position:absolute;
  right:18px; top:18px;
  width:210px;
  background:rgba(5,5,5,.97);
  border:3px solid #fff;
  border-radius:8px;
  padding:12px;
  z-index:50;
  display:none;
}
#menu.show { display:block; }
.menuItem {
  padding:8px 10px;
  border-bottom:1px solid #555;
  cursor:pointer;
}
.menuItem:last-child { border-bottom:0; }
.menuItem:hover { background:#222; }
#toast {
  position:absolute;
  top:18px;left:50%;transform:translateX(-50%);
  background:#050505;border:2px solid #fff;border-radius:8px;
  padding:8px 14px;z-index:60;display:none;
}
#toast.show { display:block; }
kbd {
  border:1px solid #888;border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:#222;
}
@media(max-width:900px){
  html,body{overflow:auto;touch-action:auto}
  #app{height:auto;min-height:100vh;grid-template-columns:1fr;padding:8px}
  #stage{width:96vw;max-height:none}
  #side{width:96vw;margin:0 auto;overflow:visible}
}
</style>
</head>
<body>
<div id="app">
  <div id="stageWrap">
    <div id="stage">
      <div id="map"></div>
      <div id="player"></div>
      <div id="questMarker" class="marker"></div>

      <div id="toast"></div>

      <div id="dialog">
        <div id="dialogName">村の人</div>
        <div id="dialogText"></div>
      </div>

      <div id="menu">
        <div class="menuItem" data-menu="status">ステータス</div>
        <div class="menuItem" data-menu="quest">クエスト</div>
        <div class="menuItem" data-menu="save">セーブ</div>
        <div class="menuItem" data-menu="close">閉じる</div>
      </div>
    </div>
  </div>

  <aside id="side">
    <div class="panel" id="titlePanel">
      <h1>MEI DOT RPG</h1>
      <div>メイ村</div>
      <div class="muted">Village Prototype 1.0</div>
    </div>

    <div class="panel">
      <div id="statusGrid">
        <b>名前</b><span>ユウ</span>
        <b>Lv</b><span id="lv">1</span>
        <b>HP</b><span>28 / 28</span>
      </div>
      <div class="bar hp"><i></i></div>
      <div style="margin-top:8px">MP 10 / 10</div>
      <div class="bar mp"><i></i></div>
      <div style="margin-top:8px">G <span id="gold">0</span></div>
    </div>

    <div class="panel">
      <b>クエスト</b>
      <div id="questText">村を歩いて、村人に話しかけてみよう。</div>
    </div>

    <div class="panel">
      <div id="controls">
        <button id="up">▲</button>
        <button id="left">◀</button>
        <button id="down">▼</button>
        <button id="right">▶</button>
        <button id="action">話す / 決定</button>
      </div>
      <div class="muted" style="margin-top:8px;line-height:1.7">
        移動 <kbd>WASD</kbd> / 矢印<br>
        決定 <kbd>Enter</kbd> / <kbd>Space</kbd><br>
        メニュー <kbd>Esc</kbd>
      </div>
    </div>

    <div class="panel">
      <b>時間</b>
      <div id="clock" style="font-size:20px;margin-top:5px">10:24</div>
      <div class="muted">晴れ ☀</div>
    </div>
  </aside>
</div>

<script>
const stage = document.getElementById('stage');
const player = document.getElementById('player');
const dialog = document.getElementById('dialog');
const dialogName = document.getElementById('dialogName');
const dialogText = document.getElementById('dialogText');
const menu = document.getElementById('menu');
const toast = document.getElementById('toast');
const questText = document.getElementById('questText');
const marker = document.getElementById('questMarker');
const goldEl = document.getElementById('gold');

const dirs = {down:0,up:1,left:2,right:3};
let dir='down', frame=0, held=null, lastAnim=0;
const speed=2.7, animMs=105;

// Normalized player position in stage coordinates
let x=.50, y=.54;

let state = JSON.parse(localStorage.getItem('meiRpgSave') || 'null') || {
  quest:0,
  gold:0,
  openedChest:false,
  spokeElder:false
};

function pxX(n){return stage.clientWidth*n}
function pxY(n){return stage.clientHeight*n}

function drawPlayer(){
  player.style.backgroundPosition = `${-frame*48}px ${-dirs[dir]*60}px`;
}

function syncPlayer(){
  player.style.left = (pxX(x)-24)+'px';
  player.style.top = (pxY(y)-30)+'px';
}

function rect(l,t,r,b){return {l,t,r,b}}
function overlap(a,b){
  return !(a.r<=b.l || a.l>=b.r || a.b<=b.t || a.t>=b.b);
}
function playerRect(nx,ny){
  const hw=14/stage.clientWidth, hhTop=8/stage.clientHeight, hhBottom=24/stage.clientHeight;
  return {l:nx-hw,r:nx+hw,t:ny-hhTop,b:ny+hhBottom};
}

// Collision rectangles tuned to the rendered map crop.
// Walkable stone paths remain open.
const solids = [
  rect(.00,.00,.24,.36),   // upper-left buildings/cliffs
  rect(.34,.00,.66,.29),   // church
  rect(.72,.03,1.00,.36),  // shop
  rect(.00,.43,.29,.74),   // inn / cliff
  rect(.40,.53,.60,.75),   // fountain garden
  rect(.73,.70,1.00,1.00), // lower-right home
  rect(.00,.73,.42,1.00),  // water/cliffs lower-left
  rect(.62,.82,1.00,1.00), // lower water/cliff
  rect(.84,.44,1.00,.69),  // pond
  rect(.31,.34,.40,.49),   // tree clump
  rect(.56,.34,.66,.50),   // tree clump
  rect(.30,.56,.39,.74),   // tree
  rect(.61,.56,.70,.75)    // tree
];

// Existing visible NPCs in the baked map, used as interactive targets.
const npcs = [
  {name:'村の女性',x:.16,y:.31,text:'ようこそ メイ村へ！\nここは旅人たちが行き交う、小さなやすらぎの村です。'},
  {name:'兵士',x:.52,y:.29,text:'北の教会の裏には、古い石碑がある。\n昔の勇者に関係があるらしいぞ。'},
  {name:'村の老人',x:.68,y:.49,text:'若いころ、この村の地下に遺跡があると聞いた。\n本当かどうかは知らんがのう。',elder:true},
  {name:'村の少年',x:.27,y:.67,text:'川の向こうに行ってみたいな。\nでも橋の外は魔物が出るんだって。'},
  {name:'旅人',x:.69,y:.77,text:'世界は広いよ。\nこの村だけでも、探せば何か見つかるかもしれない。'}
];

const interactables = [
  {name:'武器屋',x:.81,y:.29,range:.09,action:()=>say('武器屋','いらっしゃい！\nまだ準備中だけど、そのうち剣や防具を売る予定だよ。')},
  {name:'教会',x:.50,y:.19,range:.08,action:()=>say('神父','旅の無事を祈りましょう。\nセーブも忘れずに。')},
  {name:'宿屋',x:.16,y:.60,range:.09,action:()=>say('宿屋','一晩 5Gだよ。\n……今はサービスで休んでいきな！')},
  {name:'宝箱',x:.04,y:.08,range:.08,action:openChest},
  {name:'噴水',x:.50,y:.63,range:.08,action:()=>say('噴水','澄んだ水が静かに流れている。')}
];

function canMove(nx,ny){
  const pr=playerRect(nx,ny);
  if(pr.l<0 || pr.r>1 || pr.t<0 || pr.b>1) return false;
  for(const s of solids) if(overlap(pr,s)) return false;
  for(const n of npcs){
    const nr=rect(n.x-.018,n.y-.025,n.x+.018,n.y+.028);
    if(overlap(pr,nr)) return false;
  }
  return true;
}

function tryMove(dx,dy){
  const nx=x+dx/stage.clientWidth;
  const ny=y+dy/stage.clientHeight;
  if(canMove(nx,ny)){x=nx;y=ny;syncPlayer()}
}

function loop(ts){
  if(held && !dialog.classList.contains('show') && !menu.classList.contains('show')){
    dir=held;
    let dx=0,dy=0;
    if(held==='up')dy=-speed;
    if(held==='down')dy=speed;
    if(held==='left')dx=-speed;
    if(held==='right')dx=speed;
    tryMove(dx,dy);
    if(ts-lastAnim>animMs){
      frame=(frame+1)%4;
      drawPlayer();
      lastAnim=ts;
    }
  } else if(frame!==0){
    frame=0;drawPlayer();
  }
  requestAnimationFrame(loop);
}

function facingPoint(){
  let fx=x,fy=y;
  const d=.055;
  if(dir==='up')fy-=d;
  if(dir==='down')fy+=d;
  if(dir==='left')fx-=d;
  if(dir==='right')fx+=d;
  return {x:fx,y:fy};
}

function say(name,text){
  dialogName.textContent=name;
  dialogText.textContent=text;
  dialog.classList.add('show');
  held=null;
}

function closeDialog(){
  dialog.classList.remove('show');
}

function openChest(){
  if(state.openedChest){
    say('宝箱','からっぽだ。');
    return;
  }
  state.openedChest=true;
  state.gold += 20;
  goldEl.textContent=state.gold;
  say('宝箱','20G を手に入れた！');
  if(state.quest===1){
    state.quest=2;
    updateQuest();
  }
}

function talkOrInteract(){
  if(dialog.classList.contains('show')){closeDialog();return}
  const f=facingPoint();

  let best=null,bd=999;
  for(const n of npcs){
    const d=Math.hypot(n.x-f.x,n.y-f.y);
    if(d<bd){bd=d;best={type:'npc',obj:n}}
  }
  for(const a of interactables){
    const d=Math.hypot(a.x-f.x,a.y-f.y);
    if(d<bd){bd=d;best={type:'act',obj:a}}
  }

  if(best && bd<.09){
    if(best.type==='npc'){
      const n=best.obj;
      say(n.name,n.text);
      if(n.elder && !state.spokeElder){
        state.spokeElder=true;
        state.quest=1;
        updateQuest();
      }
    } else {
      best.obj.action();
    }
  } else {
    say('ユウ','ここには 特に何もない。');
  }
}

function updateQuest(){
  marker.style.display='none';
  if(state.quest===0){
    questText.textContent='村を歩いて、村の老人に話しかけてみよう。';
    marker.style.display='block';
    marker.style.left=(npcs[2].x*100)+'%';
    marker.style.top=(npcs[2].y*100)+'%';
  } else if(state.quest===1){
    questText.textContent='老人の話を聞いた。\n村の北西にある宝箱を探してみよう。';
    marker.style.display='block';
    marker.style.left='4%';
    marker.style.top='8%';
  } else {
    questText.textContent='宝箱を見つけた。\nメイ村を自由に探索しよう。';
  }
}

function saveGame(show=true){
  localStorage.setItem('meiRpgSave',JSON.stringify(state));
  if(show) showToast('セーブしました');
}

function showToast(msg){
  toast.textContent=msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),1400);
}

function toggleMenu(){
  if(dialog.classList.contains('show')){closeDialog();return}
  menu.classList.toggle('show');
  held=null;
}

document.querySelectorAll('.menuItem').forEach(el=>{
  el.addEventListener('click',()=>{
    const m=el.dataset.menu;
    if(m==='save') saveGame();
    if(m==='status') say('ステータス','ユウ\nLv 1\nHP 28 / 28\nMP 10 / 10\nG '+state.gold);
    if(m==='quest') say('クエスト',questText.textContent);
    menu.classList.remove('show');
  });
});

function start(d,e){
  if(e){
    e.preventDefault();
    try{e.currentTarget.setPointerCapture(e.pointerId)}catch{}
  }
  if(dialog.classList.contains('show') || menu.classList.contains('show')) return;
  held=d;dir=d;frame=1;drawPlayer();
}
function stop(){held=null}

['up','down','left','right'].forEach(id=>{
  const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>start(id,e));
  b.addEventListener('pointerup',stop);
  b.addEventListener('pointercancel',stop);
  b.addEventListener('lostpointercapture',stop);
});
document.getElementById('action').addEventListener('click',talkOrInteract);

const keys={
  ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',
  w:'up',W:'up',s:'down',S:'down',a:'left',A:'left',d:'right',D:'right'
};
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){
    e.preventDefault();talkOrInteract();return;
  }
  if(e.key==='Escape'){e.preventDefault();toggleMenu();return}
  const d=keys[e.key];
  if(!d)return;
  e.preventDefault();
  if(!held)start(d);
});
document.addEventListener('keyup',e=>{
  const d=keys[e.key];
  if(d && held===d)stop();
});
window.addEventListener('blur',stop);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});

function tickClock(){
  const d=new Date();
  document.getElementById('clock').textContent =
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
setInterval(tickClock,1000);tickClock();

goldEl.textContent=state.gold;
syncPlayer();drawPlayer();updateQuest();requestAnimationFrame(loop);
</script>
</body>
</html>
