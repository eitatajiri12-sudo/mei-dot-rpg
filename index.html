*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#0d0d0d;color:#fff;font-family:monospace;overflow:hidden;touch-action:none}
body{display:flex;align-items:center;justify-content:center}

#game{
  width:100vw;height:100vh;
  display:grid;
  grid-template-columns:minmax(0,1fr) 230px;
  grid-template-rows:auto 1fr;
  gap:20px;
  padding:18px 24px;
  align-items:center;
  justify-items:center;
}

h1{
  grid-column:1 / -1;
  margin:0;
  font-size:clamp(24px,2.4vw,40px);
  letter-spacing:.14em;
}

#field{
  position:relative;
  width:min(72vh,68vw);
  height:min(72vh,68vw);
  max-width:760px;
  max-height:760px;
  min-width:420px;
  min-height:420px;
  background:
    radial-gradient(circle at 22% 28%,rgba(255,255,255,.045) 0 1px,transparent 1px),
    radial-gradient(circle at 71% 66%,rgba(0,0,0,.045) 0 1px,transparent 1px),
    #63b34c;
  background-size:14px 14px,18px 18px,auto;
  border:4px solid #f2efe7;
  overflow:hidden;
}

  display:flex;

  grid-template-columns:68px 68px 68px;

#up{grid-column:2;grid-row:1}

  body{overflow:auto}
  #game{
    min-height:100vh;
    height:auto;
    grid-template-columns:1fr;
    grid-template-rows:auto auto auto;
    padding:16px;
  }
  h1{grid-column:1}
  #field{
    width:min(88vw,72vh);
    height:min(88vw,72vh);
    min-width:300px;
    min-height:300px;
  }
  #side{width:auto}
}
</style>
</head>
<body>
<div id="game">
  <h1>MEI DOT RPG</h1>
  <div id="field"><div id="player"></div></div>
  <div id="side">
    <div id="controls">
      <button id="up">▲</button>
      <button id="left">◀</button>
      <button id="down">▼</button>
      <button id="right">▶</button>
    </div>
    <div id="note">長押しで連続移動<br>矢印キー / WASD</div>
  </div>
</div>

<script>
const field=document.getElementById('field');
const player=document.getElementById('player');

const dirs={down:0,up:1,left:2,right:3};
let dir='down', frame=0;
let x=0,y=0;
let heldDir=null;
let lastAnim=0;
const speed=3.3;
const animMs=100;

function center(){
  x=field.clientWidth/2-32;
  y=field.clientHeight/2-40;
  player.style.left=x+'px';
  player.style.top=y+'px';
}
function draw(){
  player.style.backgroundPosition=`${-frame*64}px ${-dirs[dir]*80}px`;
}
center(); draw();

function loop(now){
  if(heldDir){
    dir=heldDir;
    if(dir==='up') y-=speed;
    if(dir==='down') y+=speed;
    if(dir==='left') x-=speed;
    if(dir==='right') x+=speed;

    x=Math.max(0,Math.min(field.clientWidth-64,x));
    y=Math.max(0,Math.min(field.clientHeight-80,y));

    player.style.left=x+'px';
    player.style.top=y+'px';

    if(now-lastAnim>animMs){
      frame=(frame+1)%4;
      draw();
      lastAnim=now;
    }
  } else if(frame!==0){
    frame=0;
    draw();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function start(d,e){
  if(e){
    e.preventDefault();
    try{e.currentTarget.setPointerCapture(e.pointerId)}catch{}
  }
  heldDir=d; dir=d; frame=1; draw();
}
function stop(){heldDir=null}

['up','down','left','right'].forEach(id=>{
  const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>start(id,e));
  b.addEventListener('pointerup',stop);
  b.addEventListener('pointercancel',stop);
  b.addEventListener('lostpointercapture',stop);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});

const keys={
  ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',
  w:'up',W:'up',s:'down',S:'down',a:'left',A:'left',d:'right',D:'right'
};
document.addEventListener('keydown',e=>{
  const d=keys[e.key]; if(!d)return;
  e.preventDefault();
  if(!heldDir) start(d);
});
document.addEventListener('keyup',e=>{
  const d=keys[e.key]; if(!d)return;
  e.preventDefault();
  if(heldDir===d) stop();
});

window.addEventListener('blur',stop);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
window.addEventListener('resize',()=>{
  x=Math.max(0,Math.min(field.clientWidth-64,x));
  y=Math.max(0,Math.min(field.clientHeight-80,y));
  player.style.left=x+'px';
  player.style.top=y+'px';
});
</script>
