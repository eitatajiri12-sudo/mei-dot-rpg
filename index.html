  will-change:left,top,background-position;
}
#controls{display:grid;grid-template-columns:78px 78px 78px;grid-template-rows:64px 64px;gap:10px;user-select:none}
button{font:inherit;font-size:27px;background:#222;color:#fff;border:2px solid #eee;border-radius:10px;touch-action:none;user-select:none}
button:active{background:#444}
#up{grid-column:2;grid-row:1}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#note{font-size:13px;color:#bbb;text-align:center}
</style>
</head>
<body>
<div id="game">
  <h2>MEI DOT RPG</h2>
  <div id="field"><div id="player"></div></div>
  <div id="controls">
    <button id="up">▲</button>
    <button id="left">◀</button>
    <button id="down">▼</button>
    <button id="right">▶</button>
  </div>
  <div id="note">長押しで連続移動 / 矢印キー / WASD</div>
</div>

<script>
const field=document.getElementById('field');
const player=document.getElementById('player');

const dirs={down:0,up:1,left:2,right:3};
let dir='down', frame=0;
let x=0,y=0;
let heldDir=null;
let lastAnim=0;
const speed=2.8;
const animMs=110;

function center(){
  x=field.clientWidth/2-32;
  y=field.clientHeight/2-40;
  player.style.left=x+'px';
  player.style.top=y+'px';
}
function draw(){
  const col=frame;
  const row=dirs[dir];
  player.style.backgroundPosition=`${-col*64}px ${-row*80}px`;
}
center(); draw();

function loop(now){
  if(heldDir){
    dir=heldDir;
    if(dir==='up') y-=speed;
    if(dir==='down') y+=speed;
    if(dir==='left') x-=speed;
    if(dir==='right') x+=speed;

    x=Math.max(0,Math.min(field.clientWidth-64,x));
    y=Math.max(0,Math.min(field.clientHeight-80,y));

    player.style.left=x+'px';
    player.style.top=y+'px';

    if(now-lastAnim>animMs){
      frame=(frame+1)%4;
      draw();
      lastAnim=now;
    }
  } else if(frame!==0){
    frame=0; draw();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function start(d,e){
  if(e){
    e.preventDefault();
    try{e.currentTarget.setPointerCapture(e.pointerId)}catch{}
  }
  heldDir=d; dir=d; frame=1; draw();
}
function stop(){heldDir=null}

['up','down','left','right'].forEach(id=>{
  const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>start(id,e));
  b.addEventListener('pointerup',stop);
  b.addEventListener('pointercancel',stop);
  b.addEventListener('lostpointercapture',stop);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});

const keys={
  ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',
  w:'up',W:'up',s:'down',S:'down',a:'left',A:'left',d:'right',D:'right'
};
document.addEventListener('keydown',e=>{
  const d=keys[e.key]; if(!d)return;
  e.preventDefault();
  if(!heldDir) start(d);
});
document.addEventListener('keyup',e=>{
  const d=keys[e.key]; if(!d)return;
  e.preventDefault();
  if(heldDir===d) stop();
});
window.addEventListener('blur',stop);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
window.addEventListener('resize',()=>{
  x=Math.max(0,Math.min(field.clientWidth-64,x));
  y=Math.max(0,Math.min(field.clientHeight-80,y));
  player.style.left=x+'px';
  player.style.top=y+'px';
});
</script>
</body>
</html>
