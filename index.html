<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEI DOT RPG</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      height: 100%;
      overflow: hidden;
    }

    #game {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    #field {
      position: relative;
      width: 320px;
      height: 320px;
      background: #6faa4f;
      border: 4px solid white;
      overflow: hidden;
    }

    #player {
      position: absolute;
      width: 32px;
      height: 32px;
      left: 144px;
      top: 144px;
      font-size: 28px;
      line-height: 32px;
      text-align: center;
    }

    #controls {
      margin-top: 20px;
      display: grid;
      grid-template-columns: 70px 70px 70px;
      gap: 8px;
      justify-content: center;
    }

    button {
      height: 60px;
      font-size: 24px;
      background: #222;
      color: white;
      border: 2px solid white;
      border-radius: 8px;
    }

    #up {
      grid-column: 2;
    }

    #left {
      grid-column: 1;
      grid-row: 2;
    }

    #down {
      grid-column: 2;
      grid-row: 2;
    }

    #right {
      grid-column: 3;
      grid-row: 2;
    }
  </style>
</head>
<body>

<div id="game">
  <h2>MEI DOT RPG</h2>

  <div id="field">
    <div id="player">🧙</div>
  </div>

  <div id="controls">
    <button id="up">▲</button>
    <button id="left">◀</button>
    <button id="down">▼</button>
    <button id="right">▶</button>
  </div>
</div>

<script>
  const player = document.getElementById("player");

  let x = 144;
  let y = 144;
  const step = 16;

  function move(dx, dy) {
    x += dx * step;
    y += dy * step;

    x = Math.max(0, Math.min(288, x));
    y = Math.max(0, Math.min(288, y));

    player.style.left = x + "px";
    player.style.top = y + "px";
  }

  document.getElementById("up").onclick = () => move(0, -1);
  document.getElementById("down").onclick = () => move(0, 1);
  document.getElementById("left").onclick = () => move(-1, 0);
  document.getElementById("right").onclick = () => move(1, 0);

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowUp") move(0, -1);
    if (e.key === "ArrowDown") move(0, 1);
    if (e.key === "ArrowLeft") move(-1, 0);
    if (e.key === "ArrowRight") move(1, 0);
  });
</script>

</body>
</html>
