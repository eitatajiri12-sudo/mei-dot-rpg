<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>MEI DOT RPG</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#111;color:#fff;font-family:monospace;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#game{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
h2{margin:0;font-size:24px}
#field{position:relative;width:320px;height:320px;background:#69ad4f;border:4px solid #fff;overflow:hidden;image-rendering:pixelated}
#field:before{content:"";position:absolute;inset:0;background-image:linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px);background-size:16px 16px}
#player{position:absolute;width:32px;height:32px;left:144px;top:144px;image-rendering:pixelated}
#heroCanvas{width:32px;height:32px;display:block;image-rendering:pixelated}
#controls{display:grid;grid-template-columns:68px 68px 68px;grid-template-rows:58px 58px;gap:8px}
button{font:inherit;font-size:24px;background:#222;color:#fff;border:2px solid #fff;border-radius:8px;touch-action:none}
#up{grid-column:2;grid-row:1}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
#note{font-size:12px;color:#bbb;text-align:center}
</style>
</head>
<body>
<div id="game">
  <h2>MEI DOT RPG</h2>
  <div id="field">
    <div id="player"><canvas id="heroCanvas" width="16" height="16"></canvas></div>
  </div>
  <div id="controls">
    <button id="up">▲</button><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button>
  </div>
  <div id="note">矢印キー / WASD / 画面ボタンで移動</div>
</div>
<script>
const canvas=document.getElementById('heroCanvas');
const ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const C={K:'#171717',H:'#9b5b2c',S:'#f2c38f',B:'#2f6fc7',W:'#f2f2f2',Y:'#f0c62d',R:'#d93b38',D:'#4c2e1d'};
const down1=['.....HHHH.......','....HHHHHH......','....HYSYHH......','...HSSSSSH......','...WKBKBKW......','...WWBBBBW......','....RYYYYR......','...RRBBBBRR.....','...RBBBBBBR.....','....BB..BB......','....BD..DB......','....DD..DD......','................','................','................','................'];
const down2=['.....HHHH.......','....HHHHHH......','....HYSYHH......','...HSSSSSH......','...WKBKBKW......','...WWBBBBW......','....RYYYYR......','...RRBBBBRR.....','...RBBBBBBR.....','....BB..BB......','.....D..D.......','....DD..DD......','................','................','................','................'];
const up1=['.....HHHH.......','....HHHHHH......','...HHHHHHH......','...HHHHHHH......','...WBBBBBW......','...WWBBBBW......','....RRRRRR......','...RRRRRRRR.....','...RRRRRRRR.....','....BB..BB......','....BD..DB......','....DD..DD......','................','................','................','................'];
const up2=['.....HHHH.......','....HHHHHH......','...HHHHHHH......','...HHHHHHH......','...WBBBBBW......','...WWBBBBW......','....RRRRRR......','...RRRRRRRR.....','...RRRRRRRR.....','....BB..BB......','.....D..D.......','....DD..DD......','................','................','................','................'];
const left1=['.....HHHH.......','....HHHHH.......','....HYSY........','...HSSSS........','...WKBW.........','...WWBBRR.......','....BYYRR.......','...BBBBRR.......','...BBBBRR.......','....BB.D........','...D...DD.......','..DD............','................','................','................','................'];
const left2=['.....HHHH.......','....HHHHH.......','....HYSY........','...HSSSS........','...WKBW.........','...WWBBRR.......','....BYYRR.......','...BBBBRR.......','...BBBBRR.......','....BB.D........','.....DDD........','...DD...........','................','................','................','................'];
const right1=left1.map(r=>r.split('').reverse().join(''));
const right2=left2.map(r=>r.split('').reverse().join(''));
const frames={down:[down1,down2],up:[up1,up2],left:[left1,left2],right:[right1,right2]};
let dir='down',frame=0;
function drawHero(){
  ctx.clearRect(0,0,16,16);
  const f=frames[dir][frame];
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    const ch=f[y][x]; if(ch==='.')continue;
    ctx.fillStyle=C[ch]; ctx.fillRect(x,y,1,1);
  }
}
drawHero();
const player=document.getElementById('player');
let px=144,py=144;
const step=16;
function move(dx,dy,newDir){
  dir=newDir; frame=frame?0:1;
  px=Math.max(0,Math.min(288,px+dx*step));
  py=Math.max(0,Math.min(288,py+dy*step));
  player.style.left=px+'px'; player.style.top=py+'px';
  drawHero();
  clearTimeout(move.t);
  move.t=setTimeout(()=>{frame=0;drawHero()},130);
}
const actions={up:()=>move(0,-1,'up'),down:()=>move(0,1,'down'),left:()=>move(-1,0,'left'),right:()=>move(1,0,'right')};
for(const id of Object.keys(actions)){
  const b=document.getElementById(id); let timer=null;
  const start=e=>{e.preventDefault();actions[id]();timer=setInterval(actions[id],120)};
  const stop=()=>{clearInterval(timer);timer=null};
  b.addEventListener('pointerdown',start); b.addEventListener('pointerup',stop);
  b.addEventListener('pointercancel',stop); b.addEventListener('pointerleave',stop);
}
document.addEventListener('keydown',e=>{
  if(e.repeat)return;
  const k=e.key.toLowerCase();
  if(k==='arrowup'||k==='w')actions.up();
  if(k==='arrowdown'||k==='s')actions.down();
  if(k==='arrowleft'||k==='a')actions.left();
  if(k==='arrowright'||k==='d')actions.right();
});
</script>
</body>
</html>
