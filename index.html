
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>MEI DOT RPG</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#101010;color:#fff;font-family:monospace;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#game{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
h2{margin:0;font-size:28px;letter-spacing:2px}
#field{position:relative;width:min(84vw,420px);aspect-ratio:1/1;background:#63b34c;border:4px solid #f3f0e6;overflow:hidden;image-rendering:pixelated}
#player{position:absolute;width:48px;height:64px;left:calc(50% - 24px);top:calc(50% - 32px);image-rendering:pixelated}
#heroCanvas{width:48px;height:64px;display:block;image-rendering:pixelated}
#controls{display:grid;grid-template-columns:76px 76px 76px;grid-template-rows:62px 62px;gap:10px}
button{font:inherit;font-size:26px;background:#222;color:#fff;border:2px solid #eee;border-radius:10px;touch-action:none}
#up{grid-column:2;grid-row:1}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
#note{font-size:13px;color:#bbb;text-align:center}
</style>
</head>
<body>
<div id="game">
<h2>MEI DOT RPG</h2>
<div id="field"><div id="player"><canvas id="heroCanvas" width="24" height="32"></canvas></div></div>
<div id="controls">
<button id="up">▲</button><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button>
</div>
<div id="note">矢印キー / WASD / 画面ボタンで移動</div>
</div>
<script>
const canvas=document.getElementById('heroCanvas'),ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const C={k:'#171717',h:'#8b4f2d',h2:'#b86f3a',s:'#f2c28f',s2:'#d89b69',b:'#2f6fc7',b2:'#1c4f9a',w:'#f0efe9',g:'#aeb4bd',y:'#f0c82e',r:'#d43c3c',r2:'#9c2424',d:'#5a351f'};
function px(x,y,w,h,c){ctx.fillStyle=C[c]||c;ctx.fillRect(x,y,w,h)}
function front(f){
ctx.clearRect(0,0,24,32);
px(7,2,10,2,'h2');px(5,4,14,2,'h');px(4,6,16,3,'h');px(6,9,12,7,'s');
px(8,11,2,2,'k');px(14,11,2,2,'k');px(7,8,10,1,'y');px(11,7,2,2,'b');
px(5,16,14,2,'w');px(4,18,16,2,'g');px(6,18,12,8,'b');px(8,20,8,6,'b2');
px(10,18,4,2,'y');px(10,24,4,2,'y');px(3,18,3,8,'r');px(18,18,3,8,'r');
px(19,17,1,4,'y');px(20,15,1,5,'g');px(21,13,1,4,'w');
px(7,26,4,3,'b');px(13,26,4,3,'b');
if(f===1){px(6,29,5,2,'d');px(14,29,4,2,'d')}else if(f===2){px(8,29,4,2,'d');px(12,29,5,2,'d')}else{px(7,29,4,2,'d');px(13,29,4,2,'d')}
}
function back(f){
ctx.clearRect(0,0,24,32);
px(7,2,10,2,'h2');px(5,4,14,3,'h');px(4,7,16,4,'h');px(5,15,14,2,'g');
px(4,17,16,11,'r');px(6,17,12,10,'r2');px(8,18,8,8,'r');px(7,27,4,2,'b');px(13,27,4,2,'b');
if(f===1){px(6,29,5,2,'d');px(14,29,4,2,'d')}else if(f===2){px(8,29,4,2,'d');px(12,29,5,2,'d')}else{px(7,29,4,2,'d');px(13,29,4,2,'d')}
}
function side(f,flip){
ctx.save();if(flip){ctx.translate(24,0);ctx.scale(-1,1)}
ctx.clearRect(0,0,24,32);
px(7,3,8,2,'h2');px(5,5,11,3,'h');px(4,8,11,3,'h');px(7,9,8,7,'s');px(13,11,2,2,'k');
px(7,8,8,1,'y');px(10,7,2,2,'b');px(6,16,10,2,'g');px(6,18,10,8,'b');px(8,19,8,7,'b2');
px(4,18,3,7,'r');px(2,20,4,7,'r2');px(14,19,3,5,'s2');px(16,18,1,4,'y');px(17,16,1,5,'g');px(18,14,1,4,'w');
if(f===1){px(6,26,5,3,'b');px(13,26,4,3,'b');px(4,29,6,2,'d');px(14,29,4,2,'d')}
else if(f===2){px(7,26,4,3,'b');px(12,26,5,3,'b');px(7,29,4,2,'d');px(13,29,6,2,'d')}
else{px(7,26,4,3,'b');px(12,26,4,3,'b');px(6,29,5,2,'d');px(13,29,5,2,'d')}
ctx.restore();
}
let dir='down',frame=0;
function draw(){if(dir==='down')front(frame);else if(dir==='up')back(frame);else if(dir==='left')side(frame,false);else side(frame,true)}
draw();
const field=document.getElementById('field'),player=document.getElementById('player');
let x=field.clientWidth/2-24,y=field.clientHeight/2-32,step=12,t;
function move(dx,dy,d){dir=d;frame=(frame+1)%3;x+=dx*step;y+=dy*step;x=Math.max(0,Math.min(field.clientWidth-48,x));y=Math.max(0,Math.min(field.clientHeight-64,y));player.style.left=x+'px';player.style.top=y+'px';draw();clearTimeout(t);t=setTimeout(()=>{frame=0;draw()},120)}
const a={up:()=>move(0,-1,'up'),down:()=>move(0,1,'down'),left:()=>move(-1,0,'left'),right:()=>move(1,0,'right')};
for(const id in a){const b=document.getElementById(id);let ti=null;const s=e=>{e.preventDefault();a[id]();ti=setInterval(a[id],110)};const e=()=>{clearInterval(ti);ti=null};b.addEventListener('pointerdown',s);b.addEventListener('pointerup',e);b.addEventListener('pointercancel',e);b.addEventListener('pointerleave',e)}
document.addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase();if(k==='arrowup'||k==='w')a.up();if(k==='arrowdown'||k==='s')a.down();if(k==='arrowleft'||k==='a')a.left();if(k==='arrowright'||k==='d')a.right()});
</script>
</body></html>
