  hero: "hero_sprites.png",

};

const IMG = {};

function loadImage(key, src) {
  return new Promise(resolve => {
    const img = new Image();

    img.onload = () => {
      IMG[key] = img;
      resolve();
    };

    img.onerror = () => {
      console.warn("画像を読み込めません:", src);
      resolve();
    };

    img.src = "./" + src;
  });
}

async function loadAllImages() {
  const jobs = [];

  for (const [key, src] of Object.entries(FILES)) {
    jobs.push(loadImage(key, src));
  }

  await Promise.all(jobs);

  loading.style.opacity = "0";

  setTimeout(() => {
    loading.style.display = "none";
  }, 500);
}


/* =========================================================
   Canvas
   ========================================================= */

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);

  canvas.style.width = innerWidth + "px";
  canvas.style.height = innerHeight + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resize);
resize();

};

/* =========================================================
   入力
   ========================================================= */

const keys = {
  up: false,
  down: false,
  left: false,
  right: false
};

const keyMap = {
  ArrowUp: "up",
  ArrowDown: "down",
  ArrowLeft: "left",
  ArrowRight: "right",

  w: "up",
  W: "up",

  a: "left",
  A: "left",

  s: "down",
  S: "down",

  d: "right",
  D: "right"
};

window.addEventListener("keydown", e => {

  if (keyMap[e.key]) {
    keys[keyMap[e.key]] = true;
    e.preventDefault();
  }

  if (
    (e.code === "Space" || e.key === "Enter") &&
    !e.repeat
  ) {
    e.preventDefault();
    interact();
  }
});

window.addEventListener("keyup", e => {

  if (keyMap[e.key]) {
    keys[keyMap[e.key]] = false;

});

/* =========================================================
   当たり判定
   ========================================================= */

function isBlocked(x, y) {

  if (
    x < 35 ||
    y < 35 ||
    x > WORLD.width - 35 ||
    y > WORLD.height - 35
  ) {
    return true;
  }

  /* 川 */

  if (
    x > 1720 &&
    !(y > 900 && y < 1120)
  ) {
    return true;
  }

  /* 建物 */

  for (const b of buildings) {

    const left = b.x + 25;
    const right = b.x + b.w - 25;

    const top = b.y + 95;
    const bottom = b.y + b.h - 15;

    if (
      x > left &&
      x < right &&
      y > top &&
      y < bottom
    ) {
      return true;
    }
  }

  return false;
}


/* =========================================================
   主人公移動
   ========================================================= */

function updatePlayer(dt) {

  if (dialogBox.style.display === "block") {
    player.moving = false;
    return;
  }

  let dx = 0;
  let dy = 0;

  if (keys.left) dx--;
  if (keys.right) dx++;
  if (keys.up) dy--;
  if (keys.down) dy++;

  if (dx === 0 && dy === 0) {

    player.moving = false;
    player.frame = 0;

    return;
  }

  const length = Math.hypot(dx, dy);

  dx /= length;
  dy /= length;

  if (Math.abs(dx) > Math.abs(dy)) {

    player.direction =
      dx < 0 ? "left" : "right";

  } else {

    player.direction =
      dy < 0 ? "up" : "down";
  }

  const distance = player.speed * dt;

  const nx = player.x + dx * distance;
  const ny = player.y + dy * distance;

  if (!isBlocked(nx, player.y)) {
    player.x = nx;
  }

  if (!isBlocked(player.x, ny)) {
    player.y = ny;
  }

  player.moving = true;

  player.frameTimer += dt;

  if (player.frameTimer > .16) {

    player.frameTimer = 0;

    player.frame =
      (player.frame + 1) % 3;
  }
}


/* =========================================================
   カメラ
   ========================================================= */

function camera() {

  let x =
    player.x -
    innerWidth / 2;

  let y =
    player.y -
    innerHeight / 2;

  x = Math.max(
    0,
    Math.min(
      WORLD.width - innerWidth,
      x
    )
  );

  y = Math.max(
    0,
    Math.min(
      WORLD.height - innerHeight,
      y
    )
  );

  return { x, y };
}


/* =========================================================
   地面
   ========================================================= */

function drawGround(time) {

  /*
     地面のベース色だけはCanvas。
     建物・人物・植物などのグラフィックは
     アップロードした画像を使用。
  */

  ctx.fillStyle = "#496f3f";

  ctx.fillRect(
    0,
    0,
    WORLD.width,
    WORLD.height
  );


  /* 地面の細かな草 */

  ctx.globalAlpha = .15;

  for (let x = 30; x < WORLD.width; x += 46) {

    for (let y = 25; y < WORLD.height; y += 43) {

      const offset =
        Math.sin(
          x * .07 +
          y * .05
        ) * 5;

      ctx.fillStyle =
        ((x + y) % 3 === 0)
          ? "#92a95e"
          : "#284f31";

      ctx.fillRect(
        x + offset,
        y,
        3,
        5
      );
    }
  }

  ctx.globalAlpha = 1;


  /* 道 */

  ctx.fillStyle = "#a18d68";

  ctx.beginPath();

  ctx.moveTo(930, 0);
  ctx.lineTo(1120, 0);
  ctx.lineTo(1120, 720);
  ctx.lineTo(1600, 720);
  ctx.lineTo(1600, 900);
  ctx.lineTo(1120, 900);
  ctx.lineTo(1120, 1550);
  ctx.lineTo(900, 1550);
  ctx.lineTo(900, 930);
  ctx.lineTo(100, 930);
  ctx.lineTo(100, 750);
  ctx.lineTo(930, 750);

  ctx.closePath();
  ctx.fill();


  /* 道の粒 */

  ctx.globalAlpha = .22;

  for (let i = 0; i < 170; i++) {

    const px =
      (i * 173) %
      WORLD.width;

    const py =
      (i * 311) %
      WORLD.height;

    ctx.fillStyle =
      i % 2
        ? "#d1bd91"
        : "#665a43";

    ctx.fillRect(
      px,
      py,
      4,
      3
    );
  }

  ctx.globalAlpha = 1;


  /* 川 */

  const waterMove =
    (time * 35) % 55;

  ctx.fillStyle = "#35788a";

  ctx.fillRect(
    1720,
    0,
    380,
    WORLD.height
  );

  ctx.globalAlpha = .35;
  ctx.strokeStyle = "#9ed5dc";
  ctx.lineWidth = 2;

  for (
    let y = -60 + waterMove;
    y < WORLD.height;
    y += 55
  ) {

    ctx.beginPath();

    ctx.moveTo(
      1740,
      y
    );

    ctx.bezierCurveTo(
      1810,
      y - 8,
      1880,
      y + 13,
      1960,
      y
    );

    ctx.stroke();
  }

  ctx.globalAlpha = 1;
}


/* =========================================================
   画像の一部だけを描画
   ========================================================= */

function drawCrop(
  img,
  sx,
  sy,
  sw,
  sh,
  dx,
  dy,
  dw,
  dh
) {

  if (!img) return;

  ctx.drawImage(
    img,
    sx,
    sy,
    sw,
    sh,
    dx,
    dy,
    dw,
    dh
  );
}


/* =========================================================
   建物
   ========================================================= */

function drawBuilding(b) {

  const img = IMG[b.image];

  if (!img) return;

  /*
     建物PNGの上部には素材集の文字があるため、
     上側を少し除外して実際の建物部分を使用。
  */

  const topCut =
    Math.min(30, img.height * .14);

  ctx.drawImage(
    img,

    0,
    topCut,

    img.width,
    img.height - topCut,

    b.x,
    b.y,

    b.w,
    b.h
  );
}


/* =========================================================
   木
   trees_plants_flowers.png 内の木を利用
   ========================================================= */

function drawTree(x, y, scale = 1) {

  const img = IMG.trees;

  if (!img) return;

  /*
     木・植物素材集の左上付近にある
     大きな木を使用。
  */

  const sw = Math.min(115, img.width * .28);
  const sh = Math.min(145, img.height * .58);

  const w = 105 * scale;
  const h = 135 * scale;

  ctx.drawImage(
    img,

    0,
    0,

    sw,
    sh,

    x - w / 2,
    y - h,

    w,
    h
  );
}


/* =========================================================
   花・低木
   ========================================================= */

function drawBush(x, y, variant = 0) {

  const img = IMG.trees;

  if (!img) return;

  const sx =
    Math.min(
      110 + variant * 55,
      Math.max(0, img.width - 60)
    );

  const sy =
    Math.min(
      90,
      Math.max(0, img.height - 60)
    );

  ctx.drawImage(
    img,
    sx,
    sy,
    55,
    55,
    x - 28,
    y - 42,
    56,
    56
  );
}

/* =========================================================
   橋
   ========================================================= */

function drawBridge() {

  const img = IMG.water;

  if (!img) return;

  /*
     水・橋・船シート中央付近の
     石橋素材を使用。
  */

  const sx =
    Math.floor(
      img.width * .18
    );

  const sy =
    Math.floor(
      img.height * .12
    );

  const sw =
    Math.max(
      40,
      Math.floor(
        img.width * .34
      )
    );

  const sh =
    Math.max(
      50,
      Math.floor(
        img.height * .70
      )
    );

  ctx.save();

  ctx.translate(
    1730,
    1010
  );

  ctx.rotate(
    Math.PI / 2
  );

  ctx.drawImage(
    img,

    sx,
    sy,
    sw,
    sh,

    -100,
    -65,
    200,
    130
  );

  ctx.restore();
}


/* =========================================================
   キャラクター素材
   ========================================================= */

function drawSpriteCharacter(
  img,
  x,
  y,
  direction = "down",
  frame = 0,
  scale = 1,
  moving = false
) {

  if (!img) return;

  /*
     元画像は完成アトラスではなく
     素材見本ボードから切り出した画像。

     そのため、各方向の領域を選択して表示する。
  */

  let row = 0;

  if (direction === "down") row = 0;
  if (direction === "left") row = 1;
  if (direction === "right") row = 1;
  if (direction === "up") row = 2;

  const columns = 3;
  const rows = 3;

  const fw =
    img.width / columns;

  const fh =
    img.height / rows;

  let col =
    moving
      ? frame % 3
      : 1;

  /*
     左右の素材構成差を吸収
  */

  if (direction === "right") {
    col =
      Math.min(
        2,
        col + 1
      );
  }

  const bob =
    moving
      ? Math.sin(
          performance.now() * .018
        ) * 1.5
      : 0;

  const dw =
    54 * scale;

  const dh =
    74 * scale;


  /* 影 */

  ctx.save();

  ctx.globalAlpha = .25;

  ctx.fillStyle = "#000";

  ctx.beginPath();

  ctx.ellipse(
    x,
    y + 2,
    17 * scale,
    7 * scale,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.restore();


  ctx.drawImage(
    img,

    col * fw,
    row * fh,

    fw,
    fh,

    x - dw / 2,
    y - dh + bob,

    dw,
    dh
  );
}

   主人公

/* =========================================================
   会話
   ========================================================= */

let storyStage = 0;

function showDialog(name, text) {

  speakerBox.textContent = name;

  dialogText.textContent = text;

  dialogBox.style.display = "block";
}

function closeDialog() {

  dialogBox.style.display = "none";
}

function setQuest(text) {

  questBox.textContent =
    "◆ " + text;
}


/* =========================================================
   調べる
   ========================================================= */

function interact() {

  if (
    dialogBox.style.display === "block"
  ) {
    closeDialog();
    return;
  }

  let nearest = null;
  let nearestDistance = Infinity;

  for (const npc of npcs) {

    const d =
      Math.hypot(
        player.x - npc.x,
        player.y - npc.y
      );

    if (d < nearestDistance) {

      nearestDistance = d;
      nearest = npc;
    }
  }

  if (
    nearest &&
    nearestDistance < 95
  ) {

    talk(nearest);

    return;
  }

  /* 井戸 */

  const wellDistance =
    Math.hypot(
      player.x - 820,
      player.y - 760
    );

  if (wellDistance < 100) {

    showDialog(
      "",
      "古い井戸だ。\n底の方から水の音が聞こえる。"
    );

    return;
  }
}


/* =========================================================
   NPC会話
   ========================================================= */

function talk(npc) {

  if (npc.name === "エレナ") {

    if (storyStage === 0) {

      showDialog(
        "エレナ",
        "ごめんね……今日は少し身体が重くてね。\n大丈夫。すぐ良くなるから。"
      );

      storyStage = 1;

      setQuest(
        "薬師に母のことを相談しよう"
      );

    } else {

      showDialog(
        "エレナ",
        "そんなに心配しなくても大丈夫よ。"
      );
    }

    return;
  }


  if (npc.name === "薬師") {

    if (storyStage < 1) {

      showDialog(
        "薬師",
        "どうしたんだい？"
      );

      return;
    }

    if (storyStage === 1) {

      showDialog(
        "薬師",
        "ただの風邪じゃなさそうだね。\n\n月白草があれば薬を作れる。\n北のルナ洞窟に生えているはずだよ。"
      );

      storyStage = 2;

      setQuest(
        "武器屋で洞窟へ行く準備をしよう"
      );

      return;
    }

    showDialog(
      "薬師",
      "月白草は北のルナ洞窟だよ。\n気をつけて行くんだよ。"
    );

    return;
  }


  if (npc.name === "武器屋") {

    if (storyStage < 2) {

      showDialog(
        "武器屋",
        "悪いが、冷やかしなら帰んな。"
      );

      return;
    }

    if (storyStage === 2) {

      showDialog(
        "武器屋",
        "洞窟へ行くだと？\n馬鹿言うな。お前は兵士でも冒険者でもないだろ。\n\n……そうか。母ちゃんのためか。\n\n昔、俺が使ってたもんだ。\nこの古びた剣を貸してやる。\n\n貸すだけだからな。\n生きて返しに来いよ。"
      );

      storyStage = 3;

      setQuest(
        "北のルナ洞窟へ向かおう"
      );

      return;
    }

    showDialog(
      "武器屋",
      "絶対に無茶はするなよ。"
    );

    return;
  }


  if (npc.name === "子供") {

    showDialog(
      "子供",
      "北の洞窟って、夜になると光るんだって！"
    );

    return;
  }


  showDialog(
    "村人",
    "エレナさん、早く良くなるといいね。"
  );
}


/* =========================================================
   描画順
   ========================================================= */

function drawWorld(time) {

  drawGround(time);


  /*
     背景側の木
  */

  for (const tree of trees) {

    drawTree(
      tree[0],
      tree[1],
      tree[2]
    );
  }


  /*
     建物
  */

  for (const b of buildings) {
    drawBuilding(b);
  }


  /*
     花・植物
  */

  for (const b of bushes) {

    drawBush(
      b[0],
      b[1],
      b[2]
    );
  }


  /*
     橋
  */

  drawBridge();


  /*
     Y座標で描画順を変更
     主人公がNPCの前後を自然に歩く
  */

  const entities = [];


  for (const npc of npcs) {

    entities.push({
      y: npc.y,
      draw: () => drawNPC(npc, time)
    });
  }


  entities.push({
    y: 760,
    draw: () => drawWell(820,760)
  });


  entities.push({
    y: 1080,
    draw: () => drawCart(1460,1080)
  });


  entities.push({
    y: player.y,
    draw: drawPlayer
  });


  entities.sort(
    (a,b) => a.y - b.y
  );


  for (const entity of entities) {

    entity.draw();
  }
}


/* =========================================================
   ゲームループ
   ========================================================= */

let lastTime = performance.now();

function loop(now) {

  const dt =
    Math.min(
      (now - lastTime) / 1000,
      .033
    );

  lastTime = now;

  updatePlayer(dt);


  ctx.clearRect(
    0,
    0,
    innerWidth,
    innerHeight
  );


  const cam = camera();


  ctx.save();

  ctx.translate(
    -cam.x,
    -cam.y
  );


  drawWorld(
    now / 1000
  );


  ctx.restore();


  requestAnimationFrame(loop);
}


/* =========================================================
   開始
   ========================================================= */

async function start() {

  await loadAllImages();

  requestAnimationFrame(loop);
}

start();

</script>
